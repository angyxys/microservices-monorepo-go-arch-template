name: Development CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  validate-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.26' 
          cache: true

      - name: Initialize Go Workspace
        run: |
          go work init
          go work use ./pkg/xerrors
          go work use ./services/users

      - name: Set up Buf CLI
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Buf Dependency Update
        run: buf dep update

      - name: Run Buf Lint
        run: buf lint

      - name: Run Buf Generate Verification
        run: buf generate

      - name: Run Workspace Unit Tests
        run: go test -v work
