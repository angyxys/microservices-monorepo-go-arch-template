name: Development CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  validate-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.23' 
          cache: true

      - name: Initialize Go Workspace
        run: |
          go work init
          go work use ./pkg/xerrors
          go work use ./services/users

      - name: Run Buf Integrated Linting
        uses: bufbuild/buf-action@v1
        with:
          input: services/users
          breaking: false

      - name: Install gRPC and Gateway Go Plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@latest

      - name: Run Buf Generate Verification
        run: buf generate services/users

      - name: Run Workspace Unit Tests
        run: go test -v work
