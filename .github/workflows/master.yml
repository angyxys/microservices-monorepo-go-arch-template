name: Master CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  production-pipeline:
    name: Build, Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Initialize Go Workspace
        run: |
          go work init
          go work use ./pkg/xerrors
          go work use ./services/users

      - name: Set up Buf CLI
        uses: bufbuild/buf-setup-action@v1

      - name: Install gRPC and Gateway Go Plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@latest

      - name: Buf Lint
        uses: bufbuild/buf-lint-action@v1

      - name: Buf Breaking Change Check
        uses: bufbuild/buf-breaking-action@v1
        with:
          against: 'https://github.com{{ github.repository }}.git#branch=master'

      - name: Buf Dependency Update
        run: buf dep update

      - name: Run Buf Generate Verification
        run: buf generate

      - name: Run Workspace Unit Tests
        run: go test -v work
